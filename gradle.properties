org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.vfs.watch=false

# Keep Kotlin compilation in the Gradle process to avoid a second JVM competing for RAM.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true

# Keep the installed app and its data when device tests finish.
android.injected.androidTest.leaveApksInstalledAfterRun=true
